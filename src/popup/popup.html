<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thru Wallet</title>
  <!-- No remote stylesheets or fonts. A wallet that fetches a font on every open leaks a
       usage/timing signal to a third party, and a remote stylesheet can inject CSS over
       balances and addresses. Removing these is also what allows the strict
       default-src 'none' CSP in manifest.json.
       To restore Inter Tight / JetBrains Mono exactly, drop the .woff2 files into
       src/popup/fonts/, add @font-face rules to styles/base.css, and extend the copy step in
       build.mjs. Until then the stack in styles/tokens.css falls back to the platform UI and
       mono faces. -->
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div id="toast-container"></div>

<!--
  SHELL ONLY. This file used to carry ~400 lines of static <section id="screen-*"> markup for
  every screen, and src/ui/router.js cleared `#screen-<id>` with innerHTML on navigation — so the
  markup for welcome, unlock and dashboard was destroyed at startup and editing it had no visible
  effect. Two thirds of it was unreachable regardless.

  Everything now renders into #app from src/ui/app/routes/**, built as DOM nodes via
  src/ui/kit/dom.js. There is deliberately no static screen markup here for a route to destroy.
-->
<div id="app" class="app"></div>

<script src="popup.bundle.js"></script>
</body>
</html>
