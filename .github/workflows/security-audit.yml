name: Wallet Automated Security Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep-scan:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run Semgrep Community and custom wallet rules
        run: >-
          semgrep scan
          --config "p/javascript"
          --config "p/security-audit"
          --config "p/secrets"
          --config ".semgrep/wallet-rules.yml"
          --error

  dependency-audit:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run npm audit (High/Critical)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  playwright-security-e2e:
    name: Extension Runtime Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install isolated browser-test tooling
        run: npm install --prefix /tmp/thru-browser-tools --no-save playwright-core@1.65.1
      - name: Build extension
        run: npm run build
      - name: Install Chromium
        run: /tmp/thru-browser-tools/node_modules/.bin/playwright-core install --with-deps chromium
      - name: Run existing browser suite
        env:
          PLAYWRIGHT_MODULE: /tmp/thru-browser-tools/node_modules/playwright-core/index.mjs
        run: |
          export CHROME_BIN="$(node --input-type=module -e 'import { chromium } from "/tmp/thru-browser-tools/node_modules/playwright-core/index.mjs"; console.log(chromium.executablePath())')"
          npm run test:browser
      - name: Upload dashboard/account visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-account-visual-captures
          path: test-results/dashboard-*.png
          if-no-files-found: ignore
          retention-days: 3
